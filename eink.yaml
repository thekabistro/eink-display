esphome:
  name: eink
  includes:
    - <vector>
    - <sstream>

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG
  baud_rate: 115200

# Enable Home Assistant API
api:
  password: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Eink Fallback Hotspot"
    password: "S27YLtLSq60y"

captive_portal:

# HTTP Request component for OneBusAway API
http_request:
  id: http_request_data
  verify_ssl: false

# E-ink display configuration - Fixed pins for Waveshare HAT
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

# Reference local font file
font:
  - file: "fonts/OpenSans-Bold.ttf"
    id: font_bold_small
    size: 25
  - file: "fonts/opensans.ttf"
    id: font_small
    size: 25
  - file: "fonts/opensans.ttf"
    id: font_medium
    size: 40
  - file: "fonts/opensans.ttf"
    id: font_large
    size: 100
  - file: "fonts/opensans.ttf"
    id: font_tiny
    size: 15
  - file: "fonts/opensans.ttf"
    id: font_micro
    size: 12
  - file: "fonts/opensans.ttf"
    id: font_date
    size: 40
  # Consolidate all icons into a single resource
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_font
    size: 100
    glyphs: &all_icons
      # Weather
      - "\U000F0590" # mdi-weather-cloudy
      - "\U000F0F2F" # mdi-weather-cloudy-alert
      - "\U000F0591" # mdi-weather-fog
      - "\U000F0592" # mdi-weather-hail
      - "\U000F0593" # mdi-weather-lightning
      - "\U000F067E" # mdi-weather-lightning-rainy
      - "\U000F0594" # mdi-weather-clear-night
      - "\U000F0595" # mdi-weather-partly-cloudy
      - "\U000F0596" # mdi-weather-pouring
      - "\U000F0597" # mdi-weather-rainy
      - "\U000F0598" # mdi-weather-snowy
      - "\U000F067F" # mdi-weather-snowy-rainy
      - "\U000F0599" # mdi-weather-sunny
      - "\U000F059D" # mdi-weather-windy
      - "\U000F059E" # mdi-weather-windy-variant
      # UI
      - "\U000F012C" # mdi-check-box-outline
      # Train Icons
      - "\U000F052C" # mdi-train (1 Line)
      - "\U000F08C4" # mdi-train-variant
      - "\U000F04DF" # mdi-subway-variant (2 Line)
      # Legend Icons
      - "\U000F004B" # mdi-arrow-down-drop-circle-outline
      - "\U000F0063" # mdi-arrow-up-drop-circle-outline
      # WiFi status (info box)
      - "\U000F05A9" # mdi-wifi
      - "\U000F05AA" # mdi-wifi-off
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_font_small
    size: 80
    glyphs: *all_icons
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_font_tiny
    size: 25
    glyphs: *all_icons
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_font_train
    size: 20
    glyphs: *all_icons

power_supply:
  - id: epaper_power
    pin: GPIO12
    enable_time: 500ms
    keep_on_time: 10s

display:
  - platform: waveshare_epaper
    id: my_display
    model: 7.50inV2alt
    cs_pin: GPIO15
    dc_pin: GPIO27
    busy_pin:
      number: GPIO25
      inverted: true
    reset_pin: GPIO26
    reset_duration: 2ms
    rotation: 270
    update_interval: 300s
    lambda: |-
      // Fill with black background
      it.fill(Color::BLACK);
      
      // Get display dimensions
      int width = it.get_width();
      int height = it.get_height();
      
      // ROUTE LINE AND STATIONS
      // Header (Updated stamp + direction legend + counts) removed so the whole
      // map can shift UP and stop cropping at the bottom. "Updated h:mm" now
      // lives in the info box. transit_start_y is small; transit_height grown so
      // Fed Way (index 25) clears the bottom crop.
      int transit_start_y = 28;
      int transit_height = 720;
      int transit_end_y = transit_start_y + transit_height;
      // 1 Line track at 150; names nudged right (was x=4) to clear the panel
      // edge and read better.
      int line_x = 150;
      int name_x = 20;

      it.line(line_x, transit_start_y, line_x, transit_end_y, Color::WHITE);

      // Short, abbreviated 1 Line station names (left-aligned at the panel edge).
      const char* station_names[] = {
        "Lynnwood", "Mtlk Terr", "Shoreline N", "Shoreline S",
        "Northgate", "Roosevelt", "U District", "UW", "Cap Hill",
        "Westlake", "Symphony", "Pioneer Sq", "ID/Chinatown", "Stadium", "SODO",
        "Beacon Hill", "Mt Baker", "Columbia", "Othello", "Rainier Bch",
        "Tukwila", "SeaTac", "Angle Lake", "Kent DM", "Star Lake", "Fed Way"
      };

      // Precompute the 1 Line station y positions (also used by the 2 Line trunk).
      int station_y[26];
      for (int i = 0; i < 26; i++) {
        int y = transit_start_y + (int)((float)i / 25.0 * transit_height);
        station_y[i] = y;
        it.filled_circle(line_x, y, 3, Color::WHITE);
        it.print(name_x, y, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, station_names[i]);
      }

      // ===== 2 LINE EAST BRANCH (BRIDGE + NORTH HOOK) =====
      // The 2 Line shares the first 13 stations (indices 0..12) with the 1 Line,
      // then at Int'l Dist/Chinatown (index 12 = the junction) it elbows EAST
      // across the I-90 floating bridge (Judkins Pk, Mercer Is) and then hooks
      // NORTH up the Eastside to Downtown Redmond. Geographically:
      //   - a HORIZONTAL bridge segment at y = y_cid (the junction latitude)
      //   - a VERTICAL north arm climbing UP the right side toward Lynnwood lat.
      const int junction_idx = 12;
      int y_cid = station_y[junction_idx];

      // Bridge: horizontal from the junction (line_x) east to bridge_end_x.
      // Judkins Pk and Mercer Is sit at ~1/3 and ~2/3 across the span.
      // Squeezed LEFT (was 360) so the north-arm station names fit on-screen.
      int bridge_end_x = 300;          // east end of bridge = base of north arm
      int judkins_x = line_x + (bridge_end_x - line_x) / 3;       // 200
      int mercer_x  = line_x + (bridge_end_x - line_x) * 2 / 3;   // 250

      // North arm: vertical at line2_x, going UP. South Bellevue sits just above
      // the bridge; Downtown Redmond climbs to ~the Lynnwood latitude (top).
      int line2_x = bridge_end_x;      // 300
      int arm_bottom_y = y_cid - 26;   // S Bellevue, just above the bridge
      int arm_top_y = station_y[0];    // Downtown Redmond ~ Lynnwood latitude

      // Build the 25-point 2 Line polyline:
      //  - points 0..12  : trunk station positions (shared with 1 Line vertical)
      //  - point 13       : Judkins Pk  (on the bridge)
      //  - point 14       : Mercer Is   (on the bridge)
      //  - points 15..24  : S Bellevue..Downtown Redmond (climbing UP the arm)
      int line2_px[25];
      int line2_py[25];
      for (int i = 0; i <= junction_idx; i++) {
        line2_px[i] = line_x;
        line2_py[i] = station_y[i];
      }
      // Bridge dots.
      line2_px[13] = judkins_x; line2_py[13] = y_cid;
      line2_px[14] = mercer_x;  line2_py[14] = y_cid;
      // North arm dots: 10 stations climbing from arm_bottom_y up to arm_top_y.
      // point 15 = bottom (S Bellevue), point 24 = top (Downtown Redmond).
      for (int i = 0; i < 10; i++) {
        int ay = arm_bottom_y - (int)((float)i / 9.0 * (arm_bottom_y - arm_top_y));
        line2_px[15 + i] = line2_x;
        line2_py[15 + i] = ay;
      }

      // "2" branch line-label, just above the elbow at the junction.
      it.print(judkins_x, y_cid - 16, id(font_tiny), Color::WHITE, TextAlign::BOTTOM_CENTER, "2");

      // Bridge line: horizontal from the junction east to the base of the arm.
      it.line(line_x, y_cid, line2_x, y_cid, Color::WHITE);
      // North arm: vertical from the bridge east-end up to Downtown Redmond.
      it.line(line2_x, arm_bottom_y, line2_x, arm_top_y, Color::WHITE);
      // Short connector so the arm visibly joins the bridge corner.
      it.line(line2_x, y_cid, line2_x, arm_bottom_y, Color::WHITE);

      // Station dots + short names. Names kept short so the north arm fits within
      // the 480px width with the arm squeezed left to line2_x=300.
      const char* east_names[] = {
        "Judkins", "Mercer", "S Bellevue", "E Main", "Bellevue", "Wilburton",
        "Spring Dt", "BelRed", "Overlake", "Rdmnd Tch", "Marymoor", "Rdmnd Dt"
      };
      // Bridge stations: dots on the bridge, names BELOW the bridge line so they
      // stay clear of the 1 Line trunk and the bridge train icons (which ride
      // ABOVE the bridge).
      for (int i = 0; i < 2; i++) {
        int dx = line2_px[13 + i];
        int dy = line2_py[13 + i];
        it.filled_circle(dx, dy, 3, Color::WHITE);
        it.print(dx, dy + 8, id(font_tiny), Color::WHITE, TextAlign::TOP_CENTER, east_names[i]);
      }
      // North-arm stations: dots on the arm, names pushed OUT to the RIGHT
      // (train icons ride the INNER/left side, so names never overlap them).
      for (int i = 0; i < 10; i++) {
        int dx = line2_px[15 + i];
        int dy = line2_py[15 + i];
        it.filled_circle(dx, dy, 3, Color::WHITE);
        it.print(line2_x + 14, dy, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, east_names[2 + i]);
      }

      // ===== INFO BOX (lower-right white space) =====
      // Sits below the bridge and right of the 1 Line trunk, in the now-empty
      // band. Shows Updated time, WiFi + Home Assistant status, and train counts.
      // Right edge pulled IN off the panel edge so it no longer crops.
      {
        int box_l = 200, box_t = 560, box_r = 455, box_b = 748;
        it.rectangle(box_l, box_t, box_r - box_l, box_b - box_t, Color::WHITE);
        int tx = box_l + 14;   // text left
        int ix = box_l + 14;   // icon left
        int vx = box_l + 44;   // value/text after icon

        // The panel redraws every 5 min, so "now" IS the last-updated time.
        auto time = id(time_sensor).now();
        if (time.is_valid()) {
          it.printf(tx, box_t + 24, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT,
                    "Updated %s", time.strftime("%I:%M %p").c_str());
        }

        // WiFi connected?
        bool wifi_ok = wifi::global_wifi_component != nullptr &&
                       wifi::global_wifi_component->is_connected();
        const char* wifi_icon = wifi_ok ? "\U000F05A9" : "\U000F05AA";
        it.print(ix, box_t + 56, id(icon_font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, wifi_icon);
        it.printf(vx, box_t + 56, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT,
                  "WiFi %s", wifi_ok ? "OK" : "--");

        // Home Assistant API connected? (check-box glyph when up)
        bool ha_ok = api::global_api_server != nullptr &&
                     api::global_api_server->is_connected();
        if (ha_ok) {
          it.print(ix, box_t + 86, id(icon_font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, "\U000F012C");
        }
        it.printf(vx, box_t + 86, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT,
                  "HA %s", ha_ok ? "OK" : "--");

        // Recount trains (cheap CSV split) for the box.
        int ib_c1 = 0, ib_c2 = 0;
        if (id(train_positions).has_state()) {
          std::stringstream ss(id(train_positions).state);
          std::string s;
          while (std::getline(ss, s, ',')) { if (!s.empty()) ib_c1++; }
        }
        if (id(train_2_positions).has_state()) {
          std::stringstream ss(id(train_2_positions).state);
          std::string s;
          while (std::getline(ss, s, ',')) { if (!s.empty()) ib_c2++; }
        }
        it.printf(tx, box_t + 122, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, "1 Line: %d", ib_c1);
        it.printf(tx, box_t + 150, id(font_tiny), Color::WHITE, TextAlign::CENTER_LEFT, "2 Line: %d", ib_c2);
      }

      // REAL TRAIN DATA PARSING
      if (id(train_positions).has_state() && id(train_directions).has_state()) {
        std::string pos_str = id(train_positions).state;
        std::string dir_str = id(train_directions).state;

        std::vector<float> positions;
        std::stringstream pos_ss(pos_str);
        std::string segment;
        while(std::getline(pos_ss, segment, ',')) {
           positions.push_back(std::stof(segment));
        }

        std::vector<int> directions;
        std::stringstream dir_ss(dir_str);
        while(std::getline(dir_ss, segment, ',')) {
           directions.push_back(std::stoi(segment));
        }

        if (positions.size() == directions.size()) {
          for (size_t i = 0; i < positions.size(); ++i) {
            yield(); // Prevent WDT timeout

            float progress = positions[i];
            int direction = directions[i];

            int train_y = transit_start_y + (int)(progress * transit_height);
            int train_x = (direction == 1) ? line_x + 15 : line_x - 15;

            const char* icon = (direction == 1) ? "\U000F052C" : "\U000F08C4"; // up or down circle arrow
            it.print(train_x, train_y, id(icon_font_train), Color::WHITE, TextAlign::CENTER, icon);
          }
        } else {
          it.print(width - 5, 770, id(font_micro), Color::WHITE, TextAlign::TOP_RIGHT, "1 Line: Mismatch");
        }
      } else {
        it.print(width - 5, 770, id(font_micro), Color::WHITE, TextAlign::TOP_RIGHT, "1 Line: No State");
      }

      // ===== 2 LINE TRAIN DATA PARSING =====
      // Same parsing as the 1 Line, but each train's fraction is mapped along the
      // 25-point 2 Line polyline (13 trunk points + 12 east-branch dots) so trunk
      // trains ride the shared line and post-junction trains follow the elbow east.
      if (id(train_2_positions).has_state() && id(train_2_directions).has_state()) {
        std::string pos2_str = id(train_2_positions).state;
        std::string dir2_str = id(train_2_directions).state;

        std::vector<float> positions2;
        std::stringstream pos2_ss(pos2_str);
        std::string segment2;
        while(std::getline(pos2_ss, segment2, ',')) {
           if (!segment2.empty()) positions2.push_back(std::stof(segment2));
        }

        std::vector<int> directions2;
        std::stringstream dir2_ss(dir2_str);
        while(std::getline(dir2_ss, segment2, ',')) {
           if (!segment2.empty()) directions2.push_back(std::stoi(segment2));
        }

        if (positions2.size() == directions2.size()) {
          const int num_segments = 24; // 25 points -> 24 segments
          for (size_t i = 0; i < positions2.size(); ++i) {
            yield(); // Prevent WDT timeout

            float f = positions2[i];
            if (f < 0.0f) f = 0.0f;
            if (f > 1.0f) f = 1.0f;
            int direction = directions2[i];

            float p = f * num_segments;
            int lo = (int)p;
            if (lo > num_segments) lo = num_segments;
            int hi = lo + 1;
            if (hi > num_segments) hi = num_segments;
            float t = p - (float)lo;

            int tx = (int)(line2_px[lo] + (line2_px[hi] - line2_px[lo]) * t);
            int ty = (int)(line2_py[lo] + (line2_py[hi] - line2_py[lo]) * t);

            // Offset trains onto the INNER side so they never overlap names:
            //  - trunk (lo < 12): vertical line -> offset in x (matches 1 Line).
            //  - bridge (12 <= lo < 14): horizontal -> offset UP (names are below).
            //  - north arm (lo >= 14): vertical -> offset LEFT toward center.
            if (lo < 12) {
              tx += (direction == 1) ? 14 : -14;
            } else if (lo < 14) {
              ty -= 14;            // above the bridge; names sit below it
            } else {
              tx -= 16;            // inner/left of the arm; names sit to the right
            }

            // Distinct 2 Line glyph: mdi-subway-variant (vs. 1 Line's mdi-train).
            const char* icon2 = "\U000F04DF";
            it.print(tx, ty, id(icon_font_train), Color::WHITE, TextAlign::CENTER, icon2);
          }
        } else {
          it.print(width - 5, 786, id(font_micro), Color::WHITE, TextAlign::TOP_RIGHT, "2 Line: Mismatch");
        }
      }

# Sensors
sensor:
  - platform: uptime
    name: "E-Ink Transit Display Uptime"
    id: uptime_sensor
    update_interval: 300s

text_sensor:
  - platform: homeassistant
    id: train_positions
    entity_id: sensor.link_positions
    internal: true
  - platform: homeassistant
    id: train_directions
    entity_id: sensor.link_directions
    internal: true
    # No on_value refresh: the panel redraws only on the 300s update_interval
    # (and the manual Refresh button), not on every HA push.
  - platform: homeassistant
    id: train_2_positions
    entity_id: sensor.link_2_positions
    internal: true
  - platform: homeassistant
    id: train_2_directions
    entity_id: sensor.link_2_directions
    internal: true
    # No on_value refresh (see train_directions above).

time:
  - platform: homeassistant
    id: time_sensor

button:
  - platform: template
    name: "Refresh E-Ink Display"
    on_press:
    - lambda: |-
        id(my_display).fill(Color::WHITE);
        id(my_display).update();
    - component.update: my_display